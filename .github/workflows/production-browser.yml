name: Public browser acceptance
on: workflow_dispatch
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Use cloud runner Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test real public site in fresh desktop and mobile browser contexts
        env:
          PLAYWRIGHT_BASE_URL: https://austin-fc-fan-assistant.vercel.app
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-proof
          path: |
            playwright-report/
            test-results/
