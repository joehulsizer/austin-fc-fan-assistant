name: Cloud checks
on: [push, workflow_dispatch]
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==6.0.2
      - run: python scripts/ingest.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-source-snapshot
          path: data/knowledge.json
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Validate embedded stadium map
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('public/q2-stadium-map.svg')"
      - run: npm run test
        id: unit
        continue-on-error: true
      - run: npm run eval
        id: evaluation
        continue-on-error: true
      - run: npm run eval:conversations
        id: conversations
        continue-on-error: true
      - name: Use cloud runner Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo 'PLAYWRIGHT_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser acceptance checks
        run: |
          npm run start > /tmp/austin-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          npm run test:browser
      - name: Require all evaluation stages to pass
        if: always()
        run: test '${{ steps.unit.outcome }}' = 'success' && test '${{ steps.evaluation.outcome }}' = 'success' && test '${{ steps.conversations.outcome }}' = 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            evaluation-results.json
            conversation-evaluation-results.json
            playwright-report/
            test-results/
            /tmp/austin-server.log
