name: Production red team
on: workflow_dispatch
jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated knowledge feed and storage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/test_feed_live.py
      - name: Verify private submission and approval workflow
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KNOWLEDGE_SUBMIT_SECRET: ${{ secrets.KNOWLEDGE_SUBMIT_SECRET }}
        run: python scripts/test_workflow_live.py
      - name: Original red-team cases on production
        id: original
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/redteam_live.py
      - name: October red-team cases on production
        id: october
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REDTEAM_CASES: data/october-redteam.json
          REDTEAM_OUTPUT: october-live-results.json
        run: python scripts/redteam_live.py
      - name: Require both public suites to pass
        if: always()
        run: test '${{ steps.original.outcome }}' = 'success' && test '${{ steps.october.outcome }}' = 'success'
      - name: Export retained fallback and template hits for review
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/export_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-transcripts
          path: |
            redteam-live-results.json
            feed-live-results.json
            october-live-results.json
            workflow-live-results.json
            diagnostic-review-candidates.json
